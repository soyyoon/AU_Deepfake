# Stage 1 — Xception artifact detector training config

data:
  metadata_csv: /kaggle/working/processed/dataset_metadata.csv
  processed_root: /kaggle/working/processed
  frames_per_video: 64
  # Sample N frames per video each epoch (saves memory vs all 64).
  # Mid-training: per-frame is fast, no need to oversample.
  frames_sampled_per_epoch: 8
  image_size: 299              # Xception default
  num_workers: 4

model:
  backbone: xception
  pretrained: true
  dropout: 0.3

train:
  batch_size: 32
  epochs: 20
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 1
  amp: true
  early_stop_patience: 5
  loss: bce
  # class imbalance handling - automatically computed if null
  pos_weight: null

eval:
  metrics: [auc, ap, f1, acc]
  threshold: 0.5

output:
  ckpt_dir: ./checkpoints/stage1
  log_dir: ./logs/stage1
  best_metric: auc
