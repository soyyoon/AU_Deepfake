# Stage 2 — AU temporal model with dual head

data:
  metadata_csv: /kaggle/working/processed/dataset_metadata.csv
  processed_root: /kaggle/working/processed
  num_aus: 17
  seq_len: 64
  num_workers: 4

model:
  trunk_dim: 128
  num_layers: 3        # number of dilated 1D-conv blocks
  dropout: 0.2

train:
  batch_size: 64
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 1
  amp: true
  early_stop_patience: 7
  # dual-loss weights:  total = seq_loss + lambda_frame * frame_loss
  lambda_frame: 0.5
  pos_weight: null

eval:
  metrics: [auc, ap, f1, acc]
  threshold: 0.5

output:
  ckpt_dir: ./checkpoints/stage2
  log_dir: ./logs/stage2
  best_metric: auc
