version: "3.9"

services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DEVICE: cpu              # change to cuda when GPU image is built
    depends_on:
      - redis
    volumes:
      - ./server/weights:/app/weights

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
